server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    location = /health { access_log off; return 200 "ok\n"; }
    location = /config.js { add_header Cache-Control "no-store" always; }
    location = /sw.js { add_header Cache-Control "no-cache" always; }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location /downloads/ { alias /downloads/; add_header Cache-Control "no-cache" always; }
    location = /source.tar.gz { alias /downloads/source.tar.gz; }
    location /ws {
        proxy_pass http://game:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location /rtc {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location /twirp/ {
        proxy_pass http://livekit:7880;
        proxy_set_header Host $host;
    }
    location @native_game {
        proxy_pass http://game:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
    location / {
        error_page 418 = @native_game;
        if ($http_upgrade = websocket) { return 418; }
        try_files $uri $uri/ =404;
    }
}
