name: Marco Windows release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact approved source commit
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: marco-windows-${{ inputs.source_ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build and verify both Windows executables
        shell: pwsh
        run: |
          $env:UV_PYTHON = Join-Path $env:pythonLocation 'python.exe'
          ./deployment/marco-vps/build-desktop.ps1 -Output "$env:RUNNER_TEMP/desktop"
          if ($LASTEXITCODE) { throw 'Desktop build failed' }
          ./client/.venv/Scripts/python.exe deployment/marco-vps/package_windows_release.py "$env:RUNNER_TEMP/windows-release" --desktop "$env:RUNNER_TEMP/desktop/PlayAural"
          if ($LASTEXITCODE) { throw 'Desktop packaging failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
