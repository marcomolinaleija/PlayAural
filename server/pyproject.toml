[project]
name = "playaural-server"
version = "1.0.5.3+marco.1"
description = "PlayAural Game Server"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "mashumaro>=3.11",
    "fluent-runtime>=0.4.0",
    "babel>=2.14",
    "openskill>=6.1.3",
    "argon2-cffi>=23.1",
    "livekit-api>=1.2.1,<2",
    "aiohttp>=3.14,<4",
    "pillow>=11.3,<14",
    "elevenlabs>=2.77.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
]
s3 = [
    "boto3>=1.35,<2",
]

[project.scripts]
playaural-server = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "__main__.py",
    "audio.py",
    "chat_channels.py",
    "cli.py",
    "copy_protocol.py",
    "gender.py",
    "main.py",
    "menu_pagination.py",
    "administration",
    "auth",
    "core",
    "documentation",
    "forum",
    "games",
    "game_utils",
    "locales",
    "messages",
    "moderation",
    "network",
    "persistence",
    "tables",
    "ui",
    "users",
    "voice",
]

[tool.hatch.build.targets.wheel.sources]
"" = "server"
